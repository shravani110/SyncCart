# ==========================================
# SyncCart Application Configuration
# ==========================================
spring.application.name=synccart-backend
server.port=8080

# Default profile: H2 in-memory with automatic schema creation and web console
spring.profiles.active=h2

# JSON Date Formatting
spring.jackson.serialization.write-dates-as-timestamps=false

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# ==========================================
# MySQL Production / Local Profile
# ==========================================
# Run with: --spring.profiles.active=mysql
# Ensure database 'synccart' is created: CREATE DATABASE IF NOT EXISTS synccart;

spring.datasource.url=jdbc:mysql://localhost:3306/synccart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
